<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/main.css">
    <title>Getting Information from a Function</title>
</head>
<body>
    <div class="container">
        <h1>Let's Make a Function</h1>

	<p>View Page Source for example code in the script tags below.</p>
        
        <p>View the console for the output of the code.</p>


        <script>
           function getRandomNumber() {
              var randomNumber = Math.floor( Math.random() * 6 ) + 1; 
                return randomNumber;
            }
            alert( getRandomNumber() );
            console.log( getRandomNumber() );
            document.write( '<h3>' + getRandomNumber() + '</h3>' );
            var dieRoll = getRandomNumber();
            alert( dieRoll );
            console.log( dieRoll );
            document.write( '<h3>' + dieRoll + '</h3>' );
        </script> 
    </div>
</body>
</html>
