<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessing Object Properties</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>JavaScript Loops, Arrays and Objects – Accessing Object Properties</h1>
    <p>View Page Source for example code in the script tags below.</p>

    <br>
    
    <hr>

<div id="output">

</div>
    <script>
        
        var person = {
          name : 'Sarah',
          country : 'US',
          age : 35,
          treehouseStudent : true,
          skills : ['JavaScript', 'HTML', 'CSS']
        };
        
        function print(message) {
          var div = document.getElementById('output');
          div.innerHTML = message;
        }
        
        var message = '<p>Hello. My name is ' + person.name + '</p>';
        message += '<p>I live in the ' + person.country + '</p>';
        person.name = 'Rainbow Dash';
        message += '<p>But, I wish my name was ' + person.name + '</p>';
        message += '<p>My age is now ' + person.age + '</p>';
        message += '<p>I have ' + person.skills.length + ' skills: ' ;
        message += person.skills.join(', ') + '</p>';

print(message);

    </script>

<!--
    <script src="js/object.js"></script>
-->
</body>
</html>
