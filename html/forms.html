<!doctype html>
<html>
    <head>
        <title>Alan McClenaghan | HTML lists</title>
        <style>

        </style>
    </head>
    <body>
        <h1>Examples of HTML Forms</h1>
        
            <h2>Basic Contact Form</h2>
        
                <form action="/my-handling-form-page" method="post">
                    
                    <!-- The <div> elements are there to conveniently structure the code and make styling easier -->
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="user_name" />
                    <div>
                    <div>
                        <label for="mail">E-mail:</label>
                        <input type="email" id="mail" name="user_email" />
                    </div>
                    <div>
                        <label for="msg">Message:</label>
                        <textarea id="msg" name="user_message"></textarea>
                    </div>
                    
                    <div class="button">
                        <button type="submit">Send your message</button>
                    </div>
                    
                </form>
        
            <h2>Basic Sign-up Form</h2>
        
                <form action="index.html" method="post">
                    <h3>Sign up</h3>
                    
                    <fieldset>
                        
                        <legend>1. Your basic info</legend>
                        
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="user_name">
                        
                        <br>

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="user_email">
                        
                        <br>

                        <label for="password">Password:</label>
                        <input type="password" id="password" name="user_password">
                        
                        <br>
                        
                        <label>Age:</label><br>
                        <input type="radio" id="under_13" value="under_13" name="user_age">
                        <label for="under_13">Under 13</label><br>
                        <input type="radio" id="over_13" value="over_13" name="user_age">
                        <label for="over_13">13 and over</label>
                    
                    </fieldset>
                    
                    <fieldset>
                        
                        <legend>2. Your profile</legend>
                        
                        <label for="bio">Biography:</label>
                        <textarea id="bio" name="user_bio"></textarea>
                        
                        <br>
                        
                        <select id="job" name="user_job">
                            <optgroup label="Web">
                                <option value="frontend_developer">Front End Developer</option>
                                <option value="php_developer">PHP Developer</option>
                                <option value="python_developer">Python End Developer</option>
                                <option value="rails_developer">Rails Developer</option>
                                <option value="wordpress_developer">WordPress Developer</option>
                                <option value="web_designer">Web Designer</option>
                            </optgroup>
                            <optgroup label="Mobile">
                                <option value="android_developer">Android Developer</option>
                                <option value="ios_developer">iOS Developer</option>
                                <option value="mobile_designer">Mobile Designer</option>
                            </optgroup>
                            <optgroup label="Business">
                                <option value="business_owner">Business Owner</option>
                                <option value="freelancer">Freelancer</option>
                            </optgroup>
                        </select>
                        
                        <br>
                                            
                        <label>Interests:</label><br>
                        <input type="checkbox" id="development" value="interest_development" name="user_interest">
                        <label for="development">Development</label><br>
                        <input type="checkbox" id="design" value="interest_design" name="user_interest">
                        <label for="design">Design</label><br>
                        <input type="checkbox" id="business" value="interest_business" name="user_interest">
                        <label for="business">Business</label>
                    </fieldset>
                    
        
                    
                    <button type="submit">Submit</button>
                </form>
        
                
                
    </body>
</html>
