<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Object Oriented JavaScript - ES6 Classes</title>
</head>
<body>
    <h1>Object Oriented JavaScript - ES6 Classes</h1>
    <p>View Page Source for example code in the script tags below.</p>      
    <p>View the console for the output of the code.</p>

    <script>
    
        class Person {
            constructor(firstName, lastName, dob) {
                this.firstName = firstName;
                this.lastName = lastName;
                this.birthday = new Date(dob)
            }

            greeting() {
                return `Hello there, ${this.firstName} ${this.lastName}`;
            }

            calculateAge() {
                const difference = Date.now() - this.birthday.getTime();
                const ageDate = new Date(difference);
                return Math.abs(ageDate.getUTCFullYear() - 1970);
            }

            getsMarried(newLastName) {
                this.lastName = newLastName;
            }
        }

        const mary = new Person('Mary', 'Williams', '11-13-1980');

        console.log(mary);

        console.log(mary.greeting());

        console.log(mary.calculateAge());

        mary.getsMarried('Thompson');

        console.log(mary);
        console.log(mary.greeting());
    
    </script>
    <!-- <script src="ES6-classes.js"></script> -->
</body>
</html>
