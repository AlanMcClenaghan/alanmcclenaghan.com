<body>

      <p>View the console for the output of the code.</p>
    <div class="row">

            <input type="submit" value="Add Task" class="btn">
            </form>
          </div>
          <div class="card-action">
            <h5 id="task-title">Tasks</h5>
            <ul class="collection">
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">

                List Item

              </li>
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">

  <script src="https://code.jquery.com/jquery-3.2.1.js" integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/js/materialize.min.js"></script>
  <script>

    // EVENT LISTENERS AND THE EVENT OBJECT

    // Anonymous function as second parameter
    document.querySelector('.btn').addEventListener('click', function(event){
        event.preventDefault();
        console.log('Hello World!')
        
    });

    // Named function as second parameter
    document.querySelector('.clear-tasks').addEventListener('click', onClick);

    function onClick(event) {
        event.preventDefault();
        console.log('clicked')

        let val;

        // Event object
        val = event;
        console.log(val);

        // Event target element
        val = event.target;
        console.log(val);

        event.target.id = 'event';
        val = event.target.id;
        console.log(val);

        val = event.target.className;
        console.log(val);

        val = event.target.classList;
        console.log(val);

        event.target.innerText = 'Clicked';

        // Event Type
        val = event.type;
        console.log(val);

        // Timestamp
        val = event.timeStamp;
        console.log(val);

        // Coordinates of event relative to window
        val = event.clientY;
        console.log(val);

        val = event.clientX;
        console.log(val);

        // Coordinates of event relative to the event
        val = event.offsetY;
        console.log(val);

        val = event.offsetX;
        console.log(val);
    };
  
  </script>
  <script src="event-listeners.js"></script>
