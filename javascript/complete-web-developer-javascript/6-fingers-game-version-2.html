<!DOCTYPE html>
<html>
  <head>
    <title>How Many Fingers Game - Version 2</title>

    <style type="text/css">
      body {
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <h1 id="instructions">How many fingers are you holding up?</h1>

    <select id="fingers">
      <option>0</option>
      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
    </select>

    <input id="submit" type="submit" value="Number of fingers" />

    <script type="text/javascript">
      var submit = document.getElementById("submit");

      submit.onclick = function() {
        var fingers = document.getElementById("fingers").value;
        var gotIt = false;
        var numberOfGuesses = 1;

        while (gotIt == false) {
          var guess = Math.floor(Math.random() * 6);

          console.log(guess);

          if (guess == fingers) {
            gotIt = true;
            alert(
              "Got it! It was " +
                fingers +
                ". It took me " +
                numberOfGuesses +
                " guess(es)."
            );
          } else {
            numberOfGuesses++;
          }
        }
      };
    </script>
  </body>
</html>
