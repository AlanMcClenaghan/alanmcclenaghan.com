<!DOCTYPE html>
<html>

    <head>
        
        <title>Animate Content | jQuery | The Complete Web Developer Course 2.0</title>
        
        <style>
            
            div {
                margin: 50px;
            }
        
            .circle {
                width: 150px;
                height: 150px;
                border-radius: 50%;
            }
            
            .square {
                width: 150px;
                height: 150px;
            }
            
            .green {
                background-color: green;
            }
            
            .red {
                background-color: red;
            }
            
            .blue {
                background-color: blue;
            }
            
            .hidden {
                display: none;
            }
            

        </style>
        
    </head>

    <body>
                
        <div class="green circle"></div>

        <script src="http://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
        
        <script type="text/javascript">
            
            $('.circle').click(function() {
                 
                $(this).animate({
                    width:"400px",
                    height:"400px",
                    marginLeft:"100px",
                    marginTop:"100px",
                }, 2000, function() {
                    $(this).css("background-color", "red");
                })

            });
 
        </script>
        
    </body>

</html>
