<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/css/materialize.min.css">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
    crossorigin="anonymous">
  <title>DOM Manipulaton & Events - Removing and Replacing Elements</title>
</head>

<body>
  <div class="container">
      <h1>DOM Manipulaton & Events - Removing and Replacing Elements</h1>
      <p>View Page Source for example code in the script tags below.</p>      
      <p>View the console for the output of the code.</p>
    <div class="row">
      <div class="col s12">
        <div id="main" class="card">
          <div class="card-content">
            <span class="card-title">Task List</span>
            <div class="row">
              <form id="task-form">
                <div class="input-field col s12">
                  <input type="text" name="task" id="task" value="Walk the dog">
                  <label for="task">New Task</label>
                </div>
            </div>
            <input type="submit" value="Add Task" class="btn">
            </form>
          </div>
          <div class="card-action">
            <h5 id="task-title">Tasks</h5>
            <ul class="collection">
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li> 
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li> 
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
            </ul>
            <a class="clear-tasks btn black" href="">Clear Tasks</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.2.1.js" integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/js/materialize.min.js"></script>
  <script>

    // REPLACE ELEMENT

    // Create Element
    const newHeading = document.createElement('h2');

    // Add id
    newHeading.id = 'title-task';

    // New text node
    newHeading.appendChild(document.createTextNode('Text List'));

    // Get the old heading
    const oldHeading = document.getElementById('task-title');

    // Parent
    const cardAction = document.querySelector('.card-action')

    // Replace
    cardAction.replaceChild(newHeading, oldHeading);

    console.log(newHeading);
    console.log(oldHeading);

    // REMOVE ELEMENT
    const LIs = document.querySelectorAll('li');
    const list = document.querySelector('ul');

    // Remove list item
    LIs[0].remove()

    // Remove list item
    list.removeChild(LIs[3])

    console.log(cardAction);


    // CLASSES & ATTRIBUTES
    const firstLi = document.querySelector('li:first-child');
    const link = firstLi.children[0];

    let val;

    // Classes
    val = link.className;
    console.log(val);

    val = link.classList;
    console.log(val);

    val = link.classList[0];
    console.log(val);

    link.classList.add('test');
    console.log(val);

    link.classList.remove('test');
    console.log(val);

    val = link;
    console.log(val);


    // Attributes
    val = link.getAttribute('href');
    console.log(val);

    val = link.setAttribute('href', 'http://google.com');
    console.log(val);

    val = link.hasAttribute('href');
    console.log(val);

    val = link.setAttribute('title', 'google');
    console.log(val);

    val = link.hasAttribute('title');
    console.log(val);

    link.removeAttribute('title');
    console.log(val);

    val = link;
    console.log(val);
 
  </script>
  <script src="removing-replacing-elements.js"></script>
</body>

</html>
