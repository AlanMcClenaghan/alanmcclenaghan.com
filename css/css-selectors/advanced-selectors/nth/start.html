<!DOCTYPE html>
<html>
<head>
	<title>Selectors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href='http://fonts.googleapis.com/css?family=Nunito:400,300' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="css/style.css">
	<style>
		body {
			font-family: 'Nunito', sans-serif;
			color: #616161;
			padding: 40px 0;
		}
        
        section {
			margin: auto;
			width: 50%;
		}
        
        h2 {
            text-align: center;
        }
        
		div {
			border-bottom: 1px dotted;
			padding: 18px 10px;
			color: #777;
		}
        
		ul {
			list-style: none;
			width: 50%;
			margin: auto;
            padding-left: 0;
		}
		li {
			border-bottom: 1px dotted;
			padding: 15px 10px;
		}
	</style>
</head>
<body>
	<ul>
		<li>Item 1</li>
		<li>Item 2</li>
		<li>Item 3</li>
		<li>Item 4</li>
		<li>Item 5</li>
		<li>Item 6</li>
		<li>Item 7</li>
		<li>Item 8</li>
		<li>Item 9</li>
		<li>Item 10</li>		
	</ul>
    <br>
    <section>
		<div>Row 1</div>
		<div>Row 2</div>
		<div>Row 3</div>
		<div>Row 4</div>
		<div>Row 5</div>	
		<div>Row 6</div>
	</section>
</body>
</html>
