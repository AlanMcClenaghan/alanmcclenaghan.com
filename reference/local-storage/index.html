<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/css/materialize.min.css">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
    crossorigin="anonymous">
  <title>DOM Manipulaton & Events - Local and Session Storage</title>
</head>

<body>
  <div class="container">
      <h1>DOM Manipulaton & Events - Local and Session Storage</h1>
      <p>View Page Source for example code in the script tags below.</p>      
      <p>View the console for the output of the code.</p>
    <div class="row">
      <div class="col s12">
        <div id="main" class="card">
          <div class="card-content">
            <span class="card-title">Task List</span>
            <div class="row">
              <form id="task-form">
                <div class="input-field col s12">
                  <input type="text" name="task" id="task" value="Walk the dog">
                  <label for="task">New Task</label>
                </div>
            </div>
            <input type="submit" value="Add Task" class="btn">
            </form>
          </div>
          <div class="card-action">
            <h5 id="task-title">Tasks</h5>
            <ul class="collection">
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li> 
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li> 
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
            </ul>
            <a class="clear-tasks btn black" href="">Clear Tasks</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.2.1.js" integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/js/materialize.min.js"></script>
  <script>

    // Set local storage item
    localStorage.setItem('name', 'John');
    localStorage.setItem('age', '30');

    // Set local storage item
    sessionStorage.setItem('name', 'Beth');
    sessionStorage.setItem('age', '28');

    // Get from local storage
    let name = localStorage.getItem('name');
    let age = localStorage.getItem('age');
    console.log(name, age);

    // Get from session storage
    name = sessionStorage.getItem('name');
    age = sessionStorage.getItem('age');
    console.log(name, age);

    // Remove from local storage item
    localStorage.removeItem('name');

    // Remove from session storage item
    sessionStorage.removeItem('name');

    // Clear storage
    // localStorage.clear();
    // sessionStorage.clear();

    document.querySelector('form').addEventListener('submit', function(event) {
        event.preventDefault();
        const input = document.querySelector('#task');
        const task = input.value;
        console.log(task);

        let tasks;

        if ( localStorage.getItem('tasks') === null ) {
            tasks = [];
        } else {
            tasks = JSON.parse(localStorage.getItem('tasks'));
        }

        tasks.push(task);

        localStorage.setItem('tasks', JSON.stringify(tasks))

        input.value = '';
    });

        console.log(localStorage);

        const tasks = JSON.parse(localStorage.getItem('tasks'));

        console.log(tasks);

        tasks.forEach(function(task) {
            console.log(task);
        });
    
  </script>
  <script src="local-storage.js"></script>
</body>

</html>
