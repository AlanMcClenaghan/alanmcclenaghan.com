<!DOCTYPE html>
<html>

    <head>
        
        <title>Changing Website Content | jQuery | The Complete Web Developer Course 2.0</title>
        
        <style>
            
            div {
                margin: 50px;
                
            }
        
            .circle {
                width: 150px;
                height: 150px;
                border-radius: 50%;
            }
            
            .square {
                width: 150px;
                height: 150px;
            }
            
            .green {
                background-color: green;
            }
            
            .red {
                background-color: red;
            }
            
            .blue {
                background-color: blue;
            }
            
        </style>
        
    </head>

    <body>
        
                
        <div class="green circle"></div>
        
        <p id="green-circle">This is the green circle</p>
        
        <div class="blue square"> This is the blue square</div>
        
        <div class="red square">Click the red square to change the channel</div>

        <iframe width="100%" height="1000px" src="http://example.com/"></iframe>
       
        
        <script src="http://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
        
        <script type="text/javascript">
            
            $('.circle').click(function() {
                $('#green-circle').html("The <em>green circle</em> was clicked!");
            });
            
            $('.blue').hover(function() {
                alert($(this).text());
            });

            $('.red').click(function() {
                $('iframe').attr("src", "http://alanmcclenaghan.com/");
                $(this).html("Channel changed!");
            });          
 
        </script>
        
    </body>

</html>
