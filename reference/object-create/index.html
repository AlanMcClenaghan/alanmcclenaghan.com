<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Object Oriented JavaScript - Using Object.create</title>
</head>
<body>
    <h1>Object Oriented JavaScript - Using Object.create</h1>
    <p>View Page Source for example code in the script tags below.</p>      
    <p>View the console for the output of the code.</p>

    <script>

        const personPrototypes = {
            greeting: function() {
                return `Hello there, ${this.firstName} ${this.lastName}`
            },
            getsMarried: function(newLastName) {
                this.lastName = newLastName;
            }
        }

        const mary = Object.create(personPrototypes);
        mary.firstName = 'Mary';
        mary.lastName = 'Williams';
        mary.age = 30;

        console.log(mary);
        console.log(mary.greeting(0));

        mary.getsMarried('Thompson');

        console.log(mary);
        console.log(mary.greeting(0));


        const brad = Object.create(personPrototypes, {
            firstName: {value: 'Brad'},
            lastName: {value: 'Traversy'},
            age: {value: 36}
        });

        console.log(brad);
        console.log(brad.greeting(0));
    
    </script>
    <!-- <script src="object-create.js"></script> -->
</body>
</html>
