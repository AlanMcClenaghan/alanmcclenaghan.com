<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JavaScript Fundamentals - Template Literals</title>
</head>
<body>
    <h1>JavaScript Fundamentals - Template Literals</h1>
    <p>View Page Source for example code in the script tags below.</p>      
    <p>View the console for the output of the code.</p>
    <script>
    
        const name = 'John';
        const age = 30;
        const job = 'Web Developer';
        const city = 'Miami';
        let html

        // Without template strings (es5)
        html = '<ul><li>Name: ' + name + '</li><li>Age: ' + age + '</li><li>Job: ' + job + '</li><li>City: ' + city + '</li></ul>';
        document.write(html);
        console.log(html);

        html =  '<ul>' +
                    '<li>Name: ' + name + '</li>' +
                    '<li>Age: ' + age + '</li>' +
                    '<li>Job: ' + job + '</li>' +
                    '<li>City: ' + city + '</li>' +
                '</ul>';
        document.write(html);
        console.log(html);


        // With template literals

        function hello() {
            return 'hello'
        }

        html =  `
            <ul>
                <li>Name: ${name}</li>
                <li>Age: ${age}</li>
                <li>Job: ${job}</li>
                <li>City: ${city}</li>
                <li>${hello()}, ${name}</li>
                <li>${2+2}</li>
                <li>${age >= 30 ? 'Over 30' : 'Under 30'}</li>
            </ul>`;
        document.write(html);
        console.log(html);
    
    </script>

    <!-- <script src="template-literals.js"></script> -->
</body>
</html>
