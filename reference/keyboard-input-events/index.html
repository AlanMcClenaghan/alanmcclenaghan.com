<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/css/materialize.min.css">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
    crossorigin="anonymous">
  <title>DOM Manipulaton & Events - Keyboard and Input Events</title>
</head>

<body>
  <div class="container">
      <h1>DOM Manipulaton & Events - Keyboard and Input Events</h1>
      <p>View Page Source for example code in the script tags below.</p>      
      <p>View the console for the output of the code.</p>
    <div class="row">
      <div class="col s12">
        <div id="main" class="card">
          <div class="card-content">
            <span class="card-title">Task List</span>
            <div class="row">
              <form id="task-form">
                <div class="input-field col s12">
                  <input type="text" name="task" id="task" value="Walk the dog">
                  <label for="task">New Task</label>
                </div>
            </div>
            <input type="submit" value="Add Task" class="btn">
            </form>
          </div>
          <div class="card-action">
            <h5 id="task-title">Tasks</h5>
            <ul class="collection">
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li> 
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li> 
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
            </ul>
            <a class="clear-tasks btn black" href="">Clear Tasks</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.2.1.js" integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/js/materialize.min.js"></script>
  <script>

    // MOUSE EVENTS

    // Element selectors
    const form = document.querySelector('form');
    const taskInput = document.querySelector('#task');
    const heading = document.querySelector('h5');

    // Clear input
    taskInput.value = '';

    // Event Handler
    function submit(event) {
        event.preventDefault();
        console.log(`EVENT TYPE: ${event.type}`);

        // Get input value
        console.log(taskInput.value);

        // Clear input
        taskInput.value = '';
    }

    // Event Handler
    function runEvent(event) {
        console.log(`EVENT TYPE: ${event.type}`);

        // Get input value
        console.log(event.target.value);

        heading.innerText = event.target.value
    }

    // Event listeners

    // Submit event
    form.addEventListener('submit', submit);

    // Keydown
    taskInput.addEventListener('keydown', runEvent);

    // Keyup
    taskInput.addEventListener('keyup', runEvent);

    // Keypress
    taskInput.addEventListener('keypress', runEvent);

    // Focus
    taskInput.addEventListener('focus', runEvent);

    // Blur
    taskInput.addEventListener('blur', runEvent);

    // cut
    taskInput.addEventListener('cut', runEvent);

    // paste
    taskInput.addEventListener('paste', runEvent);

    // input
    taskInput.addEventListener('input', runEvent);

    // change - used on select lists
    select.addEventListener('change', runEvent);
    
  </script>
  <script src="keyboard-input-events.js"></script>
</body>

</html>
