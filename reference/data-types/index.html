<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JavaScript Fundamentals - Data Types</title>
</head>
<body>
    <h1>JavaScript Fundamentals - Data Types</h1>
    <p>View Page Source for example code in the script tags below.</p>      
    <p>View the console for the output of the code.</p>
    <script>
    
        // PRIMITIVE

        // String
        const name = 'John Doe';
        const numberString = '18';
        console.log(typeof name);
        console.log(typeof numberString);

        // Number
        const age = 45;
        console.log(typeof age);

        // Boolean
        const hasKids = true;
        console.log(typeof hasKids);

        // Null
        const car = null;
        console.log(typeof car);

        // Undefined
        let test;
        console.log(typeof test);

        // Symbol
        const sym = Symbol();
        console.log(typeof sym);


        // REFERENCE TYPES - OBJECTS

        // Array
        const hobbies = ['movies', 'music'];
        console.log(typeof hobbies);

        const address = {
            city: 'London',
            state: 'UK',
        }
        console.log(typeof address);

        const today = new Date();
        console.log(today);
        console.log(typeof today);
    
    </script>

    <!-- <script src="data-types.js"></script> -->
</body>
</html>
