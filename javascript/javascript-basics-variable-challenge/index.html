<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/main.css">
    <title>The Story Maker</title>
</head>
<body>
    <div class="container">
    <h1>The Story Maker</h1>
    <p>View Page Source for example code in the script tags below.</p>   
        
    <script>
        var adjective = prompt("Please type a adjective");
        var verb = prompt("Please type a verb");
        var noun = prompt("Please type a noun");
        var message = "<h3>There once was a " + adjective 
        message += " programmer who wanted to use JavaScript to " + verb 
        message += " the " + noun + ".</h3>"
        document.write(message);
    </script>
        
    </div>
</body>
</html>
