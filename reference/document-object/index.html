  <script>

    let val;

    val = document;
    console.log(val);

    val = document.all;
    console.log(val);

    val = document.all[0];
    console.log(val);

    val = document.all.length;
    console.log(val);

    val = document.head;
    console.log(val);

    val = document.body;
    console.log(val);

    val = document.doctype;
    console.log(val);

    val = document.domain;
    console.log(val);

    val = document.URL;
    console.log(val);

    val = document.characterSet;
    console.log(val);

    val = document.contentType;
    console.log(val);

    val = document.forms;
    console.log(val);

    val = document.forms[0];
    console.log(val);

    val = document.forms[0].id;
    console.log(val);

    val = document.forms[0].method;
    console.log(val);

    val = document.forms[0].action;
    console.log(val);

    val = document.links;
    console.log(val);

    val = document.links[0];
    console.log(val);

    val = document.links[0].className;
    console.log(val);

    val = document.links[0].classList[0];
    console.log(val);

    val = document.images;
    console.log(val);

    val = document.scripts;
    console.log(val);

    val = document.scripts[2].getAttribute('src');
    console.log(val);

    let scripts = document.scripts;
    let scriptsArray = Array.from(scripts);

    scriptsArray.forEach(function(script) {
      console.log(script);
      console.log(script.getAttribute('src'));
    });
    
  </script>
