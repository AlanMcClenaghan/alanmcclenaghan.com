<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DoggoSelect</title>
    <link href="https://fonts.googleapis.com/css?family=Bree+Serif|Open+Sans:400,700" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1 class="logo">DoggoSelect</h1>
    </header>
    
    <div class="container">  
        <label for="breeds">Select a Breed</label>
        <select class="u-full-width" id="breeds"></select>
    
        <div class="card"></div>
    
        <form>
            <label for="name">Name</label>
            <input class="u-full-width" id="name" type="text">
        
            <label for="comment">Comment</label>
            <textarea class="u-full-width" id="comment"></textarea>
        
            <button type="submit" id="submit">Submit</button>
        </form>
    
        <p>Made with &lt;3 by <a href="https://teamtreehouse.com/">Treehouse</a></p>
    </div>
    
<!--
    <script src="js/app.js"></script>
-->
    
    <script>
        
        const select = document.getElementById('breeds');
        const card = document.querySelector('.card'); 
        const form = document.querySelector('form');
        
        // ------------------------------------------
        //  FETCH FUNCTIONS
        // ------------------------------------------
        
        function fetchData(url) {
            return fetch(url)
                .then(checkStatus)
                .then(response => response.json())
                .catch(error => console.log('Looks like there was a problem', error))
        }
        
        fetchData('https://dog.ceo/api/breeds/list')
            .then(data => generateOptions(data.message))
            
        
        fetchData('https://dog.ceo/api/breeds/image/random')
            .then(data => generateImage(data.message))
        
        /*
        
        Promise.all joins two or more promises and returns only when all the specified promises have completed or been rejected.
        
        Promise.all([
            fetchData('https://dog.ceo/api/breeds/list'),
            fetchData('https://dog.ceo/api/breeds/image/random')
        ])
        .then(data =>{
            const breedList = data[0].message;
            const randomImage = data[1].message;
            
            generateOptions(breedList);
            generateImage(randomImage);
        })
        */

        // ------------------------------------------
        //  HELPER FUNCTIONS
        // ------------------------------------------
        
        function checkStatus(response) {
            if (response.ok) {
                return Promise.resolve(response);
            } else {
                return Promise.reject(new Error(response.statusText))
            }
        }
        
        function generateOptions(data) {
            const options = data.map(item => `
                <option value="${item}">${item}</option>
            `).join();      
            select.innerHTML = options;
        }
        
        function generateImage(data) {
            const html = `
                <img src='${data}' alt>
                <p>Click to view images of ${select.value}s</p>
            `;
            card.innerHTML = html;
        }
        
        function fetchBreedImage() {
            const breed = select.value;
            const img = card.querySelector('img');
            const p = card.querySelector('p');
            
            fetchData(`https://dog.ceo/api/breed/${breed}/images/random`)
                .then(data => {
                    img.src = data.message;
                    img.alt = breed;
                    p.textContent = `Click to view more ${breed}s`;
                })
        }

        // ------------------------------------------
        //  EVENT LISTENERS
        // ------------------------------------------
        
        select.addEventListener('change', fetchBreedImage);
        card.addEventListener('click', fetchBreedImage);
        form.addEventListener('submit', postData);
        
        // ------------------------------------------
        //  POST DATA
        // ------------------------------------------
        
        function postData(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const comment = document.getElementById('comment').value;
            
            const config = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, comment })   
            }
        
            fetch('https://jsonplaceholder.typicode.com/comments', config)
            .then(checkStatus)
            .then(response => response.json())
            .then(data => console.log(data))
        }
        
    </script>
    
</body>
</html>
