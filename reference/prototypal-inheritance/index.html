<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Object Oriented JavaScript - Prototypal Inheritance</title>
</head>
<body>
    <h1>Object Oriented JavaScript - Prototypal Inheritance</h1>
    <p>View Page Source for example code in the script tags below.</p>      
    <p>View the console for the output of the code.</p>

    <script>

        // Person constructor
        function Person(firstName, lastName) {
            this.firstName = firstName;
            this.lastName = lastName;
        }

        // Greeting
        Person.prototype.greeting = function() {
            return `Hello there, ${this.firstName} ${this.lastName}`
        }

        const person1 = new Person('John', 'Doe');

        console.log(person1);
        console.log(person1.greeting());


        // Customer constructor
        function Customer(firstName, lastName, phone, membership) {
            Person.call(this, firstName, lastName);

            this.phone = phone;
            this.membership = membership;
        }

        // Inherit the Person prototype methods
        Customer.prototype = Object.create(Person.prototype);

        // Make customer.prototype return Customer()
        Customer.prototype.constuctor = Customer;

        // Create customer
        const customer1 = new Customer('Tom', 'Smith', '555-555-5555', 'Standard');

        console.log(customer1);

        console.log(customer1.greeting());

        // Customer greeting
        Customer.prototype.greeting = function() {
            return `Hello there, ${this.firstName} ${this.lastName}. Welcome to our company.`
        }

        console.log(customer1.greeting());
    
    </script>
    <!-- <script src="prototypal-inheritance.js"></script> -->
</body>
</html>
