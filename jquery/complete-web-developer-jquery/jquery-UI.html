<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JQuery UI | jQuery | The Complete Web Developer Course 2.0</title>
    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="/resources/demos/style.css">
    
    <style>
        #draggable { 
            width: 100px; 
            height: 100px; 
            padding: 0.5em;
            border: 1px solid black;
        }
        
        #droppable { 
            width: 300px; 
            height: 300px; 
            padding: 0.5em;
            color: white;
            background-color: blue;
            border: 1px solid black;
        }
        
        .box {
            width: 400px;
            height: 400px;
            background-color: yellow; 
            border: 1px solid black;
        }
        
    </style>
    
</head>
<body>
 
<!--
    <div id="draggable" class="ui-widget-content">
      <p>Drag me around</p>
    </div>
-->
    
<!--
    <div id="resizable" class="box">
        <span>I'm stick in the box!</span>
    </div>
-->
    
    <div id="resizable" class="box">
        <span>I'm stuck in the box!</span>
    </div>

    <div id="droppable" class="ui-widget-header">
          <p>Drop here</p>
    </div>
    
    <div id="draggable" class="ui-widget-content">
          <p>Drag me to my target</p>
    </div>


    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script>
        
        $( "#draggable" ).draggable();
        $( "#droppable" ).droppable({
          drop: function( event, ui ) {
//            alert("Dropped!");
            $( "#draggable" ).html("<p>Dropped</p>");  
          }
        });
        
        $( "span" ).draggable( {containment: "parent"} );
        
//      $( "#resizable" ).resizable( {grid:50} );
            
//      $( "#draggable" ).draggable( axis: "x" );

      
//      $( "#draggable" ).draggable( axis: "y" );

        
    </script>
    
</body>
</html>
