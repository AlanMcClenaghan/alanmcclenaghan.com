<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JavaScript Fundamentals - Numbers and the Math Object</title>
</head>
<body>
    <h1>JavaScript Fundamentals - Numbers and the Math Object</h1>
    <p>View Page Source for example code in the script tags below.</p>      
    <p>View the console for the output of the code.</p>
    <script>
        
        const num1 = 100;
        const num2 = 50;
        let val;

        // Simple math with numbers
        val = num1 + num2
        console.log(val);

        val = num1 * num2
        console.log(val);

        val = num1 - num2
        console.log(val);

        val = num1 / num2
        console.log(val);

        val = num1 % num2
        console.log(val);

        // Math Object - has properties and methods
        val = Math.PI;
        console.log(val);

        val = Math.round(val);
        console.log(val);

        val = Math.ceil(3.14);
        console.log(val);

        val = Math.floor(3.14);
        console.log(val);

        val = Math.sqrt(64);
        console.log(val);

        val = Math.abs(-3);
        console.log(val);

        val = Math.pow(8, 2);
        console.log(val);

        val = Math.min(2, 33, 4, 5, 55, 6, 3, -2);
        console.log(val);

        val = Math.max(2, 33, 4, 5, 55, 6, 3, -2);
        console.log(val);

        val = Math.random();
        console.log(val);

        val = Math.floor(Math.random());
        console.log(val);

        val = Math.floor(Math.random() * 6 + 1);
        console.log(val);
    
    </script>
    <!-- <script src="numbers.js"></script> -->
</body>
</html>
