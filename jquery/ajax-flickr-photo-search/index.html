<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AJAX Flickr Photo Search</title>
    <link href='http://fonts.googleapis.com/css?family=Varela+Round' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="grid-container centered">
        <div class="grid-100">
            <div class="contained">
                <div class="grid-100">
                    <div class="heading">
                        <h1>Flickr Photo Search</h1>
                        <form>
                          <label for="search">Type a search term</label>
                          <input type="search" name="search" id="search">
                          <input type="submit" value="Search" id="submit">
                        </form>
                        
                    </div>
                </div>
            
                <ul id="photos">
                
                </ul>
            </div>
        </div>
    </div>
    
    <script
        src="https://code.jquery.com/jquery-3.3.1.min.js"
        integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
        crossorigin="anonymous">
    </script>
    
    <script>
        const $searchField = $('#search');
        const $searchButton = $('#submit');
        
        $('form').submit( function(event) {
            event.preventDefault();
            let searchTerm = $searchField.val();
            $searchField.val("");
            $searchField.prop("disabled", true);
            $searchButton.attr("disabled", true).val("Searching...");
            const flickrAPI = "https://api.flickr.com/services/feeds/photos_public.gne?jsoncallback=?";
            let flickrOptions = {
                tags: searchTerm,
                format: "json"
            };
            function displayPhotos(data) {
                let photoHTML = '<ul>';
                $.each( data.items, function(i, photo) {
                    photoHTML += '<li class="grid-25 tablet-grid-50">';
                    photoHTML += '<a href="' + photo.link + '" class="image">';
                    photoHTML += '<img src="' + photo.media.m + '"></a></li>';
                    
                });
                photoHTML += '</ul>';
                $('#photos').html(photoHTML);
                $searchField.prop("disabled", false);
                $searchButton.attr("disabled", false).val("Search");
            }
            $.getJSON(flickrAPI, flickrOptions, displayPhotos);        
        });
    </script>
    
</body>
</html>
