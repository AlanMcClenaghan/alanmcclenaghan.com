<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JavaScript Fundamentals - Switches</title>
</head>
<body>
    <h1>JavaScript Fundamentals - Switches</h1>
    <p>View Page Source for example code in the script tags below.</p>      
    <p>View the console for the output of the code.</p>
    <script>
        
        const color = 'yellow';

        switch ( color ) {
            case 'red':
                console.log('Color is red');
                break;
            case 'blue':
                console.log('Color is blue');
                break;
            default:
                console.log('Color is not red or blue');
                break;
        }

        let day;

        switch ( new Date().getDay() ) {
            case 0:
                day = 'Sunday';
                break;
            case 1:
                day = 'Monday';
                break;
            case 2:
                day = 'Tuesday';
                break;
            case 3:
                day = 'Wednesday';
                break;
            case 4:
                day = 'Thursday';
                break;
            case 5:
                day = 'Friday';
                break;
            case 6:
                day = 'Saturday';
                break;
        }

        console.log(`Today is ${day}`)

    </script>
    <!-- <script src="switches.js"></script> -->
</body>
</html>
