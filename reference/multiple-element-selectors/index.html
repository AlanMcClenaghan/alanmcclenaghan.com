<head>

<body>
  <div class="container">
      <h1>DOM Manipulaton & Events - DOM Selectors for Multiple Elements</h1>
      <p>View Page Source for example code in the script tags below.</p>      
      <p>View the console for the output of the code.</p>
    <div class="row">
      <div class="col s12">
        <div id="main" class="card">
          <div class="card-content">
            <span class="card-title">Task List</span>
            <div class="row">
              <form id="task-form">
                <div class="input-field col s12">
                  <input type="text" name="task" id="task" value="Walk the dog">
                  <label for="task">New Task</label>
                </div>
            </div>
            <input type="submit" value="Add Task" class="btn">
            </form>
          </div>
          <div class="card-action">
            <h5 id="task-title">Tasks</h5>
            <ul class="collection">
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li> 
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li> 
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
              <li class="collection-item">
                List Item
                <a href="#" class="delete-item secondary-content">
                  <i class="fa fa-remove"></i>
                </a>
              </li>
            </ul>
            <a class="clear-tasks btn black" href="">Clear Tasks</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.2.1.js" integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/js/materialize.min.js"></script>
  <script>

    // document.getElementsByClassName - returns a HTML collection

    const items = document.getElementsByClassName('collection-item');
    console.log(items);
    console.log(items[0]);
    items[0].style.color = 'red';
    items[3].textContent = 'Hello World!';

    const listItems = document.querySelector('ul').getElementsByClassName('collection-item');
    console.log(listItems);


    // document.getElementsByTagName - returns a HTML collection

    let LIs = document.getElementsByTagName('li');
    console.log(LIs);
    console.log(LIs[0]);
    LIs[1].style.color = 'red';
    LIs[4].textContent = 'Hello World!';


    // Convert HTML Collection into array
    LIs = Array.from(LIs);
    console.log(LIs);

    LIs.reverse();
    console.log(LIs);

    LIs.forEach(function(li, index) {
        console.log(li);
        console.log(li.className);
        li.textContent = `${index}: Hello`;
    });


    // document.querySelectorAll - returns a node list

    const newItems = document.querySelectorAll('ul li')

    console.log(newItems);
    console.log(newItems[0]);

    newItems.forEach(function(li, index) {
        console.log(li);
        console.log(li.textContent);
        li.textContent = `${index}: Goodbye`;
    });

    const liOdd = document.querySelectorAll('li:nth-child(odd)');
    const liEven = document.querySelectorAll('li:nth-child(even)');

    liOdd.forEach(function(li) {
        li.style.background = '#ccc';
    });

    for ( let i = 0; i < liEven.length; i++ ) {
        liEven[i].style.background = '#f4f4f4';
    };
   
  </script>
  <!-- <script src="multiple-element-selectors.js"></script> -->
</body>

</html>
