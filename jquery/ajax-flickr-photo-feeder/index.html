<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AJAX Flickr Photo Feeder</title>
    <link href='http://fonts.googleapis.com/css?family=Varela+Round' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="grid-container centered">
        <div class="grid-100">
            <div class="contained">
                <div class="grid-100">
                    <div class="heading">
                        <h1>Flickr Photo Feeder</h1>
                        <p>Choose which kind of animal you'd like to return photos of...</p>
                    </div>
                    <ul class="filter-select">
                        <li><button>Dog</button></li>
                        <li><button>Cat</button></li>
                        <li><button>Moose</button></li>
                    </ul>
                </div>
            
                <div id="photos">
                
                </div>
            </div>
        </div>
    </div>
    
    <script
        src="https://code.jquery.com/jquery-3.3.1.min.js"
        integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
        crossorigin="anonymous">
    </script>
    
    <script>
        let $button = $('button');
        $button.click( function() {
            $button.removeClass("selected");
            $(this).addClass("selected");
            const flickrAPI = "https://api.flickr.com/services/feeds/photos_public.gne?jsoncallback=?";
            let animal = $(this).text();
            let flickrOptions = {
                tags: animal,
                format: "json"
            };
            function displayPhotos(data) {
                let photoHTML = '<ul>';
                $.each( data.items, function(i, photo) {
                    photoHTML += '<li class="grid-25 tablet-grid-50">';
                    photoHTML += '<a href="' + photo.link + '" class="image">';
                    photoHTML += '<img src="' + photo.media.m + '"></a></li>';
                    
                });
                photoHTML += '</ul>';
                $('#photos').html(photoHTML);
            }
            $.getJSON(flickrAPI, flickrOptions, displayPhotos);        
        });
    </script>
    
</body>
</html>
