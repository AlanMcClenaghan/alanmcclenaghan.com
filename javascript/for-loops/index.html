<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Loops</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="color">
    <h1>For Loops</h1>
<script>
    
    var html = "";

    for ( var i = 1; i <= 1000; i += 1 ) {
      html += "<div>" + i + "</div>";
    }
    
    document.write(html);
    
</script>
</body>
</html>
