<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JavaScript Fundamentals - Arrays and Array Methods</title>
</head>
<body>
    <h1>JavaScript Fundamentals - Arrays and Array Methods</h1>
    <p>View Page Source for example code in the script tags below.</p>      
    <p>View the console for the output of the code.</p>
    <script>
    
        // Create some methods
        const numbers = [43, 56, 33, 23, 44, 36, 5];
        const numbers2 = new Array(22, 45, 33, 76, 54);
        const fruit = ['Apple', 'Banana', 'Orange', 'Pear'];
        const mixed = [22, 'hello', true, undefined, null, {a:1, b:1}, new Date()];

        let val;

        console.log(numbers);
        console.log(val);

        // Get array length
        val = numbers.length;

        console.log(val);

        // Check if is array
        val = Array.isArray(numbers);

        console.log(val);

        // Get a single value
        val = numbers[3];
        console.log(val);

        val = numbers[0];
        console.log(val);

        // Insert into array
        numbers[2] = 100;
        console.log(numbers);

        // Find index of value
        val = numbers.indexOf(36);
        console.log(val);

        // MUTATING ARRAYS ==================================

        // Add on to end
        numbers.push(250); 
        console.log(numbers);

        // Add on to start
        numbers.unshift(120); 
        console.log(numbers);

        // Remove from the end
        numbers.pop(); 
        console.log(numbers);

        // Remove from the start
        numbers.shift(); 
        console.log(numbers);

        // Splice values
        numbers.splice(1, 1); 
        console.log(numbers);

        // Splice values
        numbers.splice(1, 3); 
        console.log(numbers);

        // Reverse values
        numbers.reverse(); 
        console.log(numbers);

        // Concatenate arrays
        val = numbers.concat(numbers2); 
        console.log(val);

        // Sorting arrays
        val = fruit.sort(); 
        console.log(val);

        // Numbers sorted by first digit
        val = numbers.sort(); 
        console.log(val);

        // Use the "compare function" to order numbers
        val = numbers.sort(function(x, y){
            return x - y;
        }); 
        console.log(val);

        // Reverse number sort
        val = numbers.sort(function(x, y){
            return y - x;
        }); 
        console.log(val);

        // Find
        function under25(num) {
            return num < 25;
        }

        val = numbers.find(under25);
        console.log(numbers);
        console.log(val);

        function over25(num) {
            return num > 25;
        }

        val = numbers.find(over25);
        console.log(numbers);
        console.log(val);
    
    </script>
    <!-- <script src="arrays.js"></script> -->
</body>
</html>
