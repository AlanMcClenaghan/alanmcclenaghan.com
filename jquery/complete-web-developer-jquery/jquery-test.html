<!DOCTYPE html>
<html>

    <head>
        
        <title>Testing if jQuery is installed | jQuery | The Complete Web Developer Course 2.0</title>
        
    </head>

    <body>
        
        <h1>Tests if jQuery is installed</h1>
    
        <p>View Page Source for examples of the code used.</p>
        
        <script src="http://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
        
        <script type="text/javascript">
            
            // Checks to see if jQuery is installed
                
            if (typeof jQuery == "undefined") {         
                alert("jQuery is not installed!");         
            } else {         
                alert("jQuery is installed correctly!");      
            }

        </script>
        
    </body>

</html>
