<!doctype html>
<html>
    <head>
        <title>Alan McClenaghan | Images in HTML</title>
    </head>
    <body>
        <h1 id="top">Images in HTML</h1>
        
        <h2>Basic image</h2>
            <img src="/images/me.png" alt="Picture of Alan McClenaghan">
        
        <h2>Image as a link</h2>
            <a href="http://www.alanmcclenaghan.com/#portfolio" target="_blank">
                <img src="/images/me.png" alt="Picture of Alan McClenaghan" title="Picture of Alan McClenaghan">
            </a>
        
        <h2>Image with a title</h2>
            <img src="/images/me.png" alt="Picture of Alan McClenaghan" title="Picture of Alan McClenaghan">
        
        
            <figure>
                <h2>Captioned image</h2>
                <img src="/images/me.png" alt="Picture of Alan McClenaghan" title="Picture of Alan McClenaghan">
                <figcaption>Picture of Alan McClenaghan</figcaption>
            </figure>
        
    </body>
</html>
